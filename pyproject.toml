[project]
name = "celine-grid-bff"
version = "1.2.0"
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
  "fastapi>=0.136.1",
  "pydantic>=2.13.4",
  "pydantic-settings>=2.14.2",
  "uvicorn[standard]>=0.46.0",
  "sqlalchemy>=2.0.51",
  "asyncpg>=0.31.0",
  "psycopg2-binary>=2.9.12",
  "alembic>=1.18.5",
  "sqlalchemy-utils>=0.42.1",
  "celine-sdk>=1.13.0",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.21.0",
    "debugpy>=1.8.20",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "python-semantic-release>=10.5.3",
]

# The suite reaches no external service: PostgreSQL, the Digital Twin, nudging-tool,
# the MQTT broker and Keycloak's JWKS are all faked. OPA is the exception and is
# deliberately real — see ADR-0002 and .agents/playbooks/testing.md.
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  # celine-sdk's generated OpenAPI models still use Pydantic v1 config. Ours to
  # neither fix nor read past on every run.
  "ignore::pydantic.PydanticDeprecatedSince20",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["src/celine/grid"]
sources = {"src" = ""}

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]

build_command = """
    uv lock --upgrade-package "$PACKAGE_NAME"
    git add uv.lock
    uv build
"""

branch = "main"
changelog_file = "CHANGELOG.md"
tag_format = "v{version}"
commit_parser = "conventional"

upload_to_release = false
upload_to_pypi = false
commit_version_number = false

[tool.semantic_release.commit_parser_options]
minor_tags = ["feat"]
patch_tags = ["fix", "perf", "up"]
parse_squash_commits = true
ignore_merge_commits = true
